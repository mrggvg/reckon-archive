name: reckon

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reckon
      POSTGRES_PASSWORD: reckon
      POSTGRES_DB: reckon
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema.sql / seed.sql readable from inside the container
      - ./:/db:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reckon -d reckon']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
